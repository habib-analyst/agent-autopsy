[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-autopsy"
version = "0.1.0"
description = "Post-mortem forensics for failed agent runs: causal attribution + resume-safety verdicts, fully offline"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman" }]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent-autopsy = "agent_autopsy.cli:main"

[tool.setuptools.packages.find]
include = ["agent_autopsy*"]
